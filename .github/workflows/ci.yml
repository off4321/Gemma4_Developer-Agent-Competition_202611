name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  teacher-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Byte-compile the training-data scripts
        run: |
          python -m compileall -q src/collect src/train src/pipeline
      - name: Run the teacher-data tests
        run: python -m pytest tests -p no:cacheprovider
