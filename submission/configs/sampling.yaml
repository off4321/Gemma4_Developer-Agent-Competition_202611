# Generation constraints (HARNESS_README §2 / §2.2).
# Allowed top-level fields ONLY (build_submission.py -> ALLOWED_GENERATION_FIELDS):
#   temperature, top_p, top_k, max_output_tokens, presence_penalty, frequency_penalty,
#   stop_sequences, response_mime_type, seed, thinking_config
# -> `thinking_budget` / `include_thoughts` MUST live under `thinking_config`.
#
# `max_output_tokens` caps ONE assistant turn (the model context itself is 128k - do not "fix"
# blow-ups by shrinking it). The context blow-up in the eval traces (600+ tokens/turn average,
# 40+ turns) is the model rewriting whole files in one turn; 1024 is still enough for an
# edit_file / search / read_file payload but cuts file-rewrite loops earlier. Never go back to
# 256: the edit_file JSON gets cut mid-string -> missing `}` -> retry loop -> context overflow.
temperature: 0.6
top_p: 0.95
max_output_tokens: 1024
thinking_config:
  thinking_budget: 2048
  include_thoughts: true        # main / analyzer need the thought step to keep tool-call chains
                                # (the verifier keeps it false: configs/verifier_sampling.yaml)
  # thinking_level: MEDIUM      # avoid: maps to OpenAI reasoning_effort and is dropped by litellm
