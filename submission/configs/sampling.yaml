# Generation constraints (HARNESS_README §2 / §2.2).
# Allowed top-level fields ONLY (build_submission.py -> ALLOWED_GENERATION_FIELDS):
#   temperature, top_p, top_k, max_output_tokens, presence_penalty, frequency_penalty,
#   stop_sequences, response_mime_type, seed, thinking_config
# -> `thinking_budget` / `include_thoughts` MUST live under `thinking_config`.
#
# `max_output_tokens` caps ONE assistant turn (thinking + tool_call combined on vLLM).
# It MUST be strictly larger than `thinking_budget` with several thousand tokens of headroom;
# setting max_output_tokens=1024 < thinking_budget=2048 caused thoughts and `<|tool_call>`
# tags to truncate mid-generation. 8192 total with thinking_budget=1536 leaves ~6656 tokens
# for `edit_file` / `write_file` payloads while capping runaway reasoning early.
temperature: 0.2
top_p: 0.95
frequency_penalty: 0.3          # stop repetitive tool_call / text loops within a single turn
max_output_tokens: 8192
thinking_config:
  thinking_budget: 1536
  include_thoughts: false       # HARNESS_README §2.4: thinking_budget > 0 enables reasoning on
                                # every turn while stripping prior turns' `<|channel>thought` from history
  # thinking_level: MEDIUM      # avoid: maps to OpenAI reasoning_effort and is dropped by litellm
