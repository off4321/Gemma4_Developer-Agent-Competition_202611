# Generation config for the root coder agent (`gemma-4-e4b-it-qat-w4a16-ct` base).
# `max_output_tokens: 6144` with `thinking_budget: 1536` leaves 4,608 tokens per turn
# for `<|tool_call>` payloads (preventing the 2048-token cutoff seen in fastapi_15589)
# while reserving 26,624 tokens of input context within vLLM's 32,768 limit.
temperature: 0.3
top_p: 0.95
frequency_penalty: 0.15
max_output_tokens: 6144
thinking_config:
  thinking_budget: 1536
  include_thoughts: true
