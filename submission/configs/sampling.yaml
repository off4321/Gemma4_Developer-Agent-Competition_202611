# Generation config for Stage 2 (`coder_agent`).
# `include_thoughts: true` retains prior turn reasoning so the 4B model remembers WHY a
# previous `read_file`/`edit_file`/`pytest` call failed and never enters 0.5s blind loops.
# `max_output_tokens: 4096` reserves 28,672 tokens of input context within 32,768.
temperature: 0.4
top_p: 0.95
frequency_penalty: 0.2
presence_penalty: 0.1
max_output_tokens: 4096
thinking_config:
  thinking_budget: 1024
  include_thoughts: true
