# Generation constraints for the `verifier` sub-agent (HARNESS_README §2.4).
# Same rule as configs/sampling.yaml: `thinking_budget` / `include_thoughts` must stay
# inside `thinking_config`, never at the top level.
# ADK/Gemini naming map (the harness schema has no `max_tokens` / `max_thoughts`):
#   max_tokens   -> max_output_tokens (1024)
#   max_thoughts -> thinking_config.thinking_budget (2048 matches the root agent)
# Verification only has to read a pytest tail and emit ~6 short lines, so it stays deterministic
# and small: a STOP-lost / rambling verdict wastes the parent's turns.
temperature: 0.1
top_p: 0.9
max_output_tokens: 1536         # concise audit verdict + failure lines if BLOCK
thinking_config:
  thinking_budget: 1024         # crisp reasoning before running audit commands
  include_thoughts: true        # preserves e4b tool-call integrity; AgentTool hides thoughts from parent
