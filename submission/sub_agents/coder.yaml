# ============================================================================
# Stage 2: Implementation & Verification Agent (coder_agent).
# Receives Stage 1's `{localization_plan?}` in its instruction, edits files,
# verifies with `py_compile` + targeted `pytest` / `/tmp/repro.py`, and writes
# its summary to `impl_report` before handing off to `submitter_agent`.
# ============================================================================
name: coder_agent
description: >-
  Applies minimal source-code fixes based on localization_plan and verifies them
  with syntax checks, targeted tests, and inline edge-case scripts.
model: gemma-4-e4b-it-qat-w4a16-ct
adapter: main_lora
output_key: impl_report
instruction: !include ../prompts/system.md
tools:
  - run_command
  - get_status
  - read_file
  - edit_file
  - write_file
skills:
  - skills/swe-guard
generate_content_config: !include ../configs/sampling.yaml
