# Read-only exploration sub-agent (AgentTool, skip_summarization: true).
# NOTE: `model` here must be IDENTICAL to the root agent model
# (validate_single_declared_model -> exactly 1 unique base model).
name: code_analyzer_agent
description: >-
  Analyzes repository source files and symbol graphs to locate root causes.
  Returns a short structured report: exact file paths, line ranges, root cause,
  and the minimal code change to apply. Does not edit files.
model: gemma-4-e4b-it-qat-w4a16-ct
# adapter: tool_lora
instruction: !include ../prompts/analyzer.md
tools:
  - read_file
  - run_command
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
generate_content_config: !include ../configs/sampling.yaml
