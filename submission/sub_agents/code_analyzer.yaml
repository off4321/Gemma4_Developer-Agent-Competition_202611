# Read-only exploration sub-agent (AgentTool, skip_summarization: true).
# NOTE: `model` here must be IDENTICAL to the root agent model
# (validate_single_declared_model -> exactly 1 unique base model).
name: code_analyzer_agent
description: >-
  High-recall read-only repository locator. Pass the COMPLETE verbatim Problem
  Statement. Searches symbol definitions, callers/subclasses, sibling
  error/warning conventions, and existing test files, returning exact file paths
  and line ranges without editing files.
model: gemma-4-e4b-it-qat-w4a16-ct
# The analyzer reads a 3k-char report out of a 3k-token turn; its LoRA is trained by the Colab
# notebook (`BUILD_MODE = "main+analyzer"`) into submission/adapters/analyzer_lora.
# NOTE: `build_submission.py --check-only` fails until that directory exists (adapter_config.json +
# adapter_model.safetensors); comment this line again to package a main-only submission.
adapter: analyzer_lora
instruction: !include ../prompts/analyzer.md
tools:
  - read_file
  - run_command
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
generate_content_config: !include ../configs/analyzer_sampling.yaml
# ↑ 2026-11-24: root と共有していた configs/sampling.yaml (temperature 0.6 / thinking 2048) から
# 分離。0.6 の sampling は exploration の grep 語を毎回入れ替えて、未確認の path を「あります」と
# 報告する幻覚（read_file 失敗 124 件 / 489 件、search_similar_code 失敗 14/25）を増やしていた。
# analyzer は lookup が仕事なので低温・小 budget にする（詳細: configs/analyzer_sampling.yaml）。

