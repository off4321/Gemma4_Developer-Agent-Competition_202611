# ============================================================================
# Stage 3: Final Diff Hygiene & Patch Submission Agent (submitter_agent).
# Runs on base gemma-4-e4b-it-qat-w4a16-ct (no LoRA bias) at low temperature to
# audit `git status` / `git diff` and deterministically call `submit_patch()`.
# ============================================================================
name: submitter_agent
description: >-
  Audits git status and git diff for clean, non-empty source modifications,
  cleans up any stray workspace files, and calls submit_patch.
model: gemma-4-e4b-it-qat-w4a16-ct
instruction: !include ../prompts/submitter.md
tools:
  - run_command
  - get_status
  - read_file
  - edit_file
  - write_file
  - submit_patch
generate_content_config: !include ../configs/submitter_sampling.yaml
